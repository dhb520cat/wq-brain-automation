# 真身部署在公开库的 .github/workflows/loop-simulate.yml。
# 源在私有库的 ops/public-simulate.yml,改这份再同步过去。
#
# 职责: 消费 batch_queue —— 队列里有料却没人吃,补料就没意义。
# 与 loop-runner 的分工:
#   loop-runner   每小时一次,做决策(补料/判死格子/淘汰模板),几秒钟
#   loop-simulate 每 20 分钟一次,做苦力(真跑回测),一批可能几十分钟
#
# 为什么在公开库: 私有仓库 Actions 要计费且已被 spending limit 卡死;
# 公开仓库分钟数免费。跑批是最耗时的活,更该放在免费这边。
#
# ⚠️ 日志公开: 业务输出全部进文件并回写私有库,公开侧只回显一行结论。

name: wq-loop-simulate

on:
  schedule:
    - cron: "*/20 * * * *"     # 与原 wq-simulate 同频: 队列深度 > 唤醒间隔
  workflow_dispatch:
    inputs:
      script:
        description: "直接跑某个脚本(留空则消费队列)"
        required: false
        default: ""
      args:
        description: "脚本参数"
        required: false
        default: ""

# ⚠️ **不要加 concurrency 组。** 曾经有过,结果它把整条链锁死了:
# 实测 2026-08-18 —— 同仓库的 loop-runner / selftest 都正常跑完,
# 唯独 loop-simulate 卡在 pending 且 JOBS 列表为空(job 根本没被创建),
# 一小时零产出,而队列里压着 17 批。原因是被取消的排队 run 没有释放组。
#
# 互斥本来就不该由 workflow 层做 —— 真正的守卫在数据库:
# queue_worker.run_one() 用 FOR UPDATE SKIP LOCKED 原子认领队列行,
# 两个 worker 同时跑也不会抢到同一批。那个守卫不会卡死,而组会。

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    # queue_worker 现在是**常驻消费者**: 在 WORKER_BUDGET_SEC(默认 300 分钟)内
    # 连续吃队列,队列空了就原地等补料,而不是跑一批就退。
    # 这样"什么时候被 cron 唤醒"就不再影响产能 —— 实测公开库 schedule
    # 只兑现名义频率的三分之一(相邻 run 间隔 34~60 分钟,名义 20 分钟)。
    # 340 = 300 预算 + 40 分钟给收尾(persist/库存同步/回写)与硬杀余量。
    timeout-minutes: 340
    steps:
      - name: 检查 secrets
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WQ_EMAIL: ${{ secrets.WQ_EMAIL }}
          WQ_PASSWORD: ${{ secrets.WQ_PASSWORD }}
        run: |
          MISS=""
          [ -z "$PRIVATE_REPO" ]       && MISS="$MISS PRIVATE_REPO"
          [ -z "$PRIVATE_REPO_TOKEN" ] && MISS="$MISS PRIVATE_REPO_TOKEN"
          [ -z "$DATABASE_URL" ]       && MISS="$MISS DATABASE_URL"
          # 跑批必须能登录平台,这里 WQ 凭据是**必需**而非可选
          [ -z "$WQ_EMAIL" ]           && MISS="$MISS WQ_EMAIL"
          [ -z "$WQ_PASSWORD" ]        && MISS="$MISS WQ_PASSWORD"
          if [ -n "$MISS" ]; then
            echo "::error::缺少 secrets:$MISS"
            exit 1
          fi

      - uses: actions/checkout@v4
        id: fetch
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/requirements.txt

      - name: 跑批
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WQ_EMAIL: ${{ secrets.WQ_EMAIL }}
          WQ_PASSWORD: ${{ secrets.WQ_PASSWORD }}
          SCRIPT: ${{ github.event.inputs.script }}
          JOB_ARGS: ${{ github.event.inputs.args }}
        run: |
          set +e
          mkdir -p reports/loop
          LOG="reports/loop/simulate-$(date -u +%Y-%m).log"
          echo "--- $(date -u +%FT%TZ) ---" >> "$LOG"
          if [ -z "$SCRIPT" ]; then
            python -u jobs/queue_worker.py >> "$LOG" 2>&1
          else
            case "$SCRIPT" in
              *[!a-zA-Z0-9_]*) echo "非法脚本名" >&2; exit 1 ;;
            esac
            python -u "jobs/$SCRIPT.py" $JOB_ARGS >> "$LOG" 2>&1
          fi
          RC=$?
          # 公开侧只回显队列结论,不带表达式/字段名
          tail -20 "$LOG" | grep -oE '队列为空|已有 [0-9]+ 个任务在跑|#[0-9]+ -> (done|failed)' | tail -1 \
            || echo "（本轮无队列结论）"
          echo "退出码 $RC"
          exit $RC

      - name: 结果入库并回写日志
        if: always() && steps.fetch.outcome == 'success'
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WQ_EMAIL: ${{ secrets.WQ_EMAIL }}
          WQ_PASSWORD: ${{ secrets.WQ_PASSWORD }}
        run: |
          set +e
          LOG="reports/loop/simulate-$(date -u +%Y-%m).log"
          python -u jobs/persist_results.py >> "$LOG" 2>&1
          # 库存同步必须跟在跑批之后 —— 这是新产出出现的时刻。
          # 它原先只挂在私有库的定时工作流里,而那边被计费卡死从不执行,
          # 于是迁过来之后库存表再没刷新过: 新结果进了结果表,
          # 而下游只读库存表,**所有新产出对下游永远不可见**。
          if [ -n "$WQ_EMAIL" ]; then
            # 增量同步实测 ~45 秒(只拉比库里最新更新的那几条)。
            # 超时收紧到 180s: 原先给的是 900s,而全量根本跑不完,
            # 于是**每个 run 都被这一步硬撑 15 分钟**,cron 20 分钟一轮、
            # concurrency 串行,2/3 的算力槽位就这么没了(实测运行间隔
            # 从 20 分钟拉到 53~93 分钟)。
            # 超时不再是"正常现象",超了就该当异常看。
            timeout 180 python -u jobs/inventory.py >> "$LOG" 2>&1
            RC_INV=$?
            echo "库存同步退出码 $RC_INV" >> "$LOG"
            [ $RC_INV -eq 124 ] && echo "::warning::库存同步超时(增量本该 <60s,检查是否退化成全量)"
          else
            echo "跳过库存同步: 未配置 WQ_EMAIL" >> "$LOG"
          fi
          # 送 check —— **验证队列也不能空**。
          # 它必须跟在库存同步之后: 新产出要先进 alphas 表才看得见。
          # 放在这里而不是单独的 workflow,是因为这条链的顺序是刚性的
          # (跑批 -> 入库 -> 同步库存 -> 送 check),拆开就得靠时序碰运气。
          if [ -n "$WQ_EMAIL" ]; then
            timeout 600 python -u jobs/check_inventory.py 20 >> "$LOG" 2>&1
            echo "送 check 退出码 $?" >> "$LOG"
          fi
          git config user.name "wq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -q -m "simulate: $(date -u +%FT%TZ)"
          git pull -q --rebase --autostash origin HEAD
          git push -q && echo "日志已回写"

      # ⚠️ 自我接力: **这是"24 小时不间断"的唯一可靠办法**。
      #
      # 靠 cron 唤醒做不到不间断 —— 公开库的 schedule 是尽力而为,
      # 实测相邻 run 间隔 34~60 分钟(名义 20 分钟)。而 worker 是 300 分钟常驻,
      # 它退出后到下一次 cron 之间的空档,模拟就是停的。
      # 实测代价: 常驻 run 期间 1918 条/小时,它一退就掉到 42 条/小时。
      #
      # 所以在 job 结束时立刻派发下一轮,把"什么时候被唤醒"从链路里彻底去掉。
      # cron 保留作为兜底: 万一某次接力失败(API 抖动/权限问题),
      # 20 分钟后 cron 会把链条重新接上,不至于永久停摆。
      #
      # 不会失控: concurrency 组保证同时只有一个 run;
      # queue_worker 见到别的 worker 在跑会立刻退;
      # 队列空时它原地等料而不是空转退出再拉起。
      - name: 接力下一轮
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set +e
          gh workflow run wq-loop-simulate -R "${{ github.repository }}" \
            && echo "已派发下一轮" \
            || echo "::warning::接力派发失败,靠 cron 兜底(最多等 20 分钟)"
