# 真身部署在公开库的 .github/workflows/loop-runner.yml。
# 这里保留源文件是为了让它跟着私有库一起版本化 —— 否则改了公开库没人知道改了什么。
#
# 为什么绕这一圈:
#   私有仓库的 Actions 要计费(08-16 因 spending limit 卡住全线停摆),
#   而**公开仓库的 Actions 分钟数无限免费**。所以公开库当跑马场,私有库当内容源。
#   顺带也免掉了维护两份代码(现存公开库的 jobs/wq 停在 08-12,正是同步失败的例证)。
#
# ⚠️ 公开仓库的运行日志**和 artifact 都是任何人可下载的**。所以:
#   1. 业务输出全部重定向进文件,绝不进 stdout
#   2. 只回显 `决策: R5 / enqueue` 这类枚举值(规则号与动作名不含策略内容)
#   3. **完整日志不走 artifact**,而是写回私有库的 reports/loop/ —— artifact 在公开库是公开的
#   4. 失败时只回显退出码,不展开 traceback(里面可能带表达式/字段名)
#   5. 私有库名也走 secret,不在公开代码里出现
#
# 公开库要配的 secrets(Settings → Secrets and variables → Actions):
#   PRIVATE_REPO        形如 owner/name,私有库的全名
#   PRIVATE_REPO_TOKEN  fine-grained PAT,**只授权那一个仓库**,Contents: Read and write
#   DATABASE_URL / WQ_EMAIL / WQ_PASSWORD

name: wq-loop-runner

on:
  schedule:
    - cron: "7 * * * *"        # 每小时 :07,避开整点全球拥堵
  workflow_dispatch:
    inputs:
      job:
        description: "要跑的任务"
        required: true
        default: "loop_tick"
        type: choice
        options: [loop_tick, dashboard_data, progress, enqueue, sync_datasets, migrate, check_inventory]
      args:
        description: "任务参数"
        required: false
        default: ""

concurrency:
  group: wq-loop-runner
  cancel-in-progress: false

permissions:
  contents: read              # 公开库自身不需要写

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 先把缺配置的情况说清楚。否则 checkout 静默产不出目录,后续步骤报
      # "No such file or directory",真实原因被盖掉 —— 无人值守的东西凌晨报错时,
      # 日志必须一眼看出缺什么。
      # 区分**必需**与**可选**: loop_tick 只做补料/判死格子/淘汰模板,全是 DB 操作,
      # 根本用不到 WQ 登录。把两者混在一起校验会因为缺一个用不上的凭据,
      # 把本来能干的活也堵死。需要 WQ 的任务(check/submit/平台侧红线)自己会降级。
      - name: 检查 secrets
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WQ_EMAIL: ${{ secrets.WQ_EMAIL }}
          WQ_PASSWORD: ${{ secrets.WQ_PASSWORD }}
        run: |
          MISS=""
          [ -z "$PRIVATE_REPO" ]       && MISS="$MISS PRIVATE_REPO"
          [ -z "$PRIVATE_REPO_TOKEN" ] && MISS="$MISS PRIVATE_REPO_TOKEN"
          [ -z "$DATABASE_URL" ]       && MISS="$MISS DATABASE_URL"
          if [ -n "$MISS" ]; then
            echo "::error::缺少必需 secrets:$MISS —— 在本仓库 Settings → Secrets and variables → Actions 配置"
            exit 1
          fi
          if [ -z "$WQ_EMAIL" ] || [ -z "$WQ_PASSWORD" ]; then
            echo "::warning::缺 WQ_EMAIL/WQ_PASSWORD —— 本轮可做补料/判死格子/淘汰模板,但跑不了 check 与 submit"
          fi
          echo "必需 secrets 齐全"

      - name: 拉取内容源(策略只存在于那边,不落公开库)
        id: fetch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只装心跳需要的两个包。pandas/numpy 是 selfcorr 的依赖,心跳用不到,
      # 每小时装一遍大包纯属烧时间。
      - run: pip install "requests>=2.32,<3" "psycopg[binary]>=3.2,<4"

      - name: 心跳
        id: tick
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WQ_EMAIL: ${{ secrets.WQ_EMAIL }}
          WQ_PASSWORD: ${{ secrets.WQ_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ secrets.PRIVATE_REPO }}
          JOB: ${{ github.event.inputs.job || 'loop_tick' }}
          JOB_ARGS: ${{ github.event.inputs.args }}
        run: |
          set +e
          case "$JOB" in
            *[!a-zA-Z0-9_]*|"") echo "非法任务名" >&2; exit 1 ;;
          esac
          mkdir -p reports/loop
          LOG="reports/loop/runner-$(date -u +%Y-%m).log"
          echo "--- $(date -u +%FT%TZ) job=$JOB ---" >> "$LOG"
          # 业务输出一律进文件 —— 公开日志里不能出现表达式/字段名/命中率
          python -u "jobs/$JOB.py" $JOB_ARGS >> "$LOG" 2>&1
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # 只回显脱敏摘要
          tail -60 "$LOG" | grep -oE '决策: R[0-9]+ / [a-z_]+' | tail -1 || echo "（本轮无决策行）"
          echo "退出码 $RC · 完整日志已写入内容源的 reports/loop/,不在公开侧展开"

      # 只在内容源真的拉下来之后才回写。原先写 always() 会在 checkout 失败时
      # 照样执行,报一个与真实原因无关的 "No such file or directory"。
      - name: 回写快照、状态板与日志
        if: always() && steps.fetch.outcome == 'success'
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WQ_EMAIL: ${{ secrets.WQ_EMAIL }}
          WQ_PASSWORD: ${{ secrets.WQ_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ secrets.PRIVATE_REPO }}
        run: |
          set +e
          LOG="reports/loop/runner-$(date -u +%Y-%m).log"
          python -u jobs/dashboard_data.py >> "$LOG" 2>&1
          python -u jobs/loop_state.py --render >> "$LOG" 2>&1
          git config user.name "wq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/ LOOP.md templates/ ops/ reports/ 2>/dev/null
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -q -m "loop: $(date -u +%FT%TZ) 心跳"
          git pull -q --rebase --autostash origin HEAD
          git push -q && echo "已回写内容源"

      - name: 心跳失败则让本次 run 变红
        if: steps.tick.outputs.rc != '0'
        run: |
          echo "心跳退出码 ${{ steps.tick.outputs.rc }} —— 详情见内容源的 reports/loop/"
          exit 1
